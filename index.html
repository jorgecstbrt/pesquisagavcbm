<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voz Ativa | Avaliação de instrução</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>tailwind.config={theme:{extend:{colors:{redx:{50:'#fff5f5',100:'#ffe3e3',200:'#ffc7c7',400:'#ff5c5c',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',950:'#2b080a'}}}}}</script>
  <style>
    *{scrollbar-width:thin;scrollbar-color:#7f1d1d #18090a} body{background:#090506;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,sans-serif} .glass{background:linear-gradient(135deg,rgba(48,12,15,.86),rgba(17,7,8,.92));border:1px solid rgba(248,113,113,.16);box-shadow:0 20px 55px rgba(0,0,0,.2)} .input{width:100%;background:#16090a;border:1px solid #482022;border-radius:12px;padding:12px 14px;color:#fff;outline:none;transition:.2s}.input:focus{border-color:#ef4444;box-shadow:0 0 0 3px #ef444422}.btn{border-radius:12px;padding:11px 17px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-1px)} .red-glow{box-shadow:0 0 80px #991b1b33} .hidden{display:none!important} @media print{.no-print{display:none!important}body{background:#fff;color:#111}.glass{background:#fff;color:#111}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const KEY='vozativa-data-v1';
    const seed={instrutores:[{id:1,nome:'SD BM Anderson Tito dos Anjos',email:'instrutor@cbmmt.gov.br'}],materias:[{id:2,nome:'Operação e deslocamento da viatura ATC',instrutorId:1}],links:[{id:3,titulo:'Avaliação de instrução ATC 2026',url:'https://forms.google.com/',materiaId:2,acessos:0,acessados:[]}],respostas:{}};
    let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed; let charts={};
    const refreshData=async()=>{try{const response=await fetch('/api/data');if(!response.ok)throw new Error('API indisponível');data=await response.json()}catch(error){console.warn('API indisponível, usando dados temporários locais',error);try{const stored=localStorage.getItem(KEY);if(stored)data=JSON.parse(stored)}catch(localError){console.warn(localError)}}};
    const save=async()=>{localStorage.setItem(KEY,JSON.stringify(data));const response=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok)throw new Error('Não foi possível salvar no banco de dados')}; const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const icon=(name)=>({shield:'♢',link:'↗',chart:'◔',users:'♙',check:'✓',plus:'+',download:'↓',logout:'↪'}[name]||'•');
    function layout(content,admin=false){return `<header class="border-b border-red-950/70 bg-[#100607]/90 sticky top-0 z-20 backdrop-blur no-print"><div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4"><a href="/" class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-redx-600 grid place-items-center font-black text-xl red-glow">V</span><span><b class="block tracking-tight">VOZ ATIVA</b><small class="text-red-200/60">Avaliação de instrução</small></span></a>${admin?'<div class="flex items-center gap-3"><span class="hidden sm:block text-xs text-red-100/60">Painel administrativo</span><button class="btn bg-red-950 text-red-200" onclick="logout()">'+icon('logout')+' Sair</button></div>':'<a href="/admin" class="text-sm text-red-200/70 hover:text-white">Acesso restrito ↗</a>'}</div></header>${content}`}
    function publicPage(){let links=data.links;return layout(`<main class="max-w-6xl mx-auto px-5 py-14 md:py-24"><section class="grid lg:grid-cols-[1.1fr_.9fr] gap-12 items-center"><div><div class="inline-flex items-center gap-2 rounded-full border border-red-500/25 bg-red-500/10 px-3 py-1 text-xs text-red-300 mb-6"><span class="w-2 h-2 rounded-full bg-red-400 animate-pulse"></span> Pesquisa institucional • 2026</div><h1 class="text-5xl md:text-7xl font-black tracking-[-.06em] leading-[.95]">Sua voz<br><span class="text-redx-500">transforma</span><br>o ensino.</h1><p class="text-lg text-red-100/60 max-w-lg mt-7 leading-relaxed">Avalie a experiência de instrução de forma rápida, segura e anônima. Sua percepção ajuda a construir treinamentos cada vez melhores.</p><div class="flex gap-3 mt-8"><a href="#formularios" class="btn bg-redx-600 hover:bg-redx-500">Responder avaliação <span class="ml-2">↗</span></a><span class="flex items-center text-xs text-red-100/40">Leva menos de 3 minutos</span></div></div><div class="glass rounded-3xl p-6 md:p-8 red-glow relative overflow-hidden"><div class="absolute -right-20 -top-20 w-64 h-64 rounded-full bg-red-700/20 blur-3xl"></div><div class="relative"><div class="flex justify-between items-start mb-10"><div><p class="text-xs uppercase tracking-[.2em] text-red-300">Central de avaliações</p><h2 class="text-2xl font-bold mt-2">Escolha um formulário</h2></div><span class="text-4xl text-red-400">◉</span></div><div class="space-y-3"><div class="flex justify-between py-3 border-b border-red-100/10 text-sm"><span class="text-red-100/50">Formulários ativos</span><b>${links.length}</b></div><div class="flex justify-between py-3 border-b border-red-100/10 text-sm"><span class="text-red-100/50">Respostas coletadas</span><b>${Object.values(data.respostas).reduce((a,b)=>a+b,0)}</b></div><div class="flex justify-between py-3 text-sm"><span class="text-red-100/50">Acesso protegido</span><b class="text-emerald-400">● Online</b></div></div></div></div></section><section id="formularios" class="mt-24"><div class="flex items-end justify-between mb-6"><div><p class="text-xs uppercase tracking-[.2em] text-red-400">Participe</p><h2 class="text-3xl font-bold mt-2">Avaliações disponíveis</h2></div><span class="text-sm text-red-100/40">${links.length} formulário(s)</span></div><div class="grid md:grid-cols-2 gap-4">${links.length?links.map(card).join(''):'<div class="glass rounded-2xl p-8 text-red-100/50 col-span-2">Nenhuma avaliação disponível no momento.</div>'}</div></section></main><footer class="max-w-6xl mx-auto px-5 py-10 border-t border-red-950 text-sm text-red-100/35">Voz Ativa · Diretoria de Ensino, Instrução e Pesquisa</footer>`)}
    function card(l){let m=data.materias.find(x=>x.id==l.materiaId), ok=l.acessados&&l.acessados.includes(sessionStorage.getItem('visitor'));return `<article class="glass rounded-2xl p-5 flex items-center justify-between gap-4 hover:border-red-500/50 transition"><div class="flex gap-4 items-center"><div class="w-11 h-11 rounded-xl bg-red-500/10 text-red-400 grid place-items-center text-xl">${icon('link')}</div><div><h3 class="font-bold">${esc(l.titulo)}</h3><p class="text-xs text-red-100/45 mt-1">${esc(m?.nome||'Avaliação geral')} · ${l.acessos||0} acessos</p></div></div><button class="btn ${ok?'bg-emerald-500/15 text-emerald-300':'bg-redx-600 hover:bg-redx-500'} whitespace-nowrap" onclick="openLink(${l.id})">${ok?'✓ Acessado':'Abrir ↗'}</button></article>`}
    function openLink(id){let l=data.links.find(x=>x.id==id);if(!sessionStorage.getItem('visitor'))sessionStorage.setItem('visitor',crypto.randomUUID?.()||String(Date.now()));let v=sessionStorage.getItem('visitor');if(!l.acessados)l.acessados=[];if(!l.acessados.includes(v)){l.acessados.push(v);l.acessos=(l.acessos||0)+1;save().catch(console.error)}window.open(l.url,'_blank','noopener');render()}
    function login(){return layout(`<main class="min-h-[calc(100vh-75px)] grid place-items-center px-5"><form onsubmit="auth(event)" class="glass w-full max-w-md rounded-3xl p-8"><div class="w-12 h-12 rounded-2xl bg-redx-600 grid place-items-center text-2xl mb-6">${icon('shield')}</div><p class="text-xs uppercase tracking-[.2em] text-red-400">Área restrita</p><h1 class="text-3xl font-black mt-2">Entrar no painel</h1><p class="text-sm text-red-100/45 mt-2 mb-7">Acesso exclusivo para gestão das avaliações.</p><label class="text-xs text-red-100/60">Usuário<input id="user" class="input mt-2 mb-4" autocomplete="username" required></label><label class="text-xs text-red-100/60">Senha<input id="pass" type="password" class="input mt-2" autocomplete="current-password" required></label><p id="error" class="text-red-400 text-sm mt-3"></p><button class="btn bg-redx-600 hover:bg-redx-500 w-full mt-5">Acessar painel</button><a href="/" class="block text-center text-xs text-red-100/40 mt-5">← Voltar para a página pública</a></form></main>`)}
    function auth(e){e.preventDefault();if(user.value==='gavbm'&&pass.value==='gav 193'){sessionStorage.admin='1';render()}else error.textContent='Usuário ou senha inválidos.'} function logout(){sessionStorage.removeItem('admin');render()}
    function adminPage(){return layout(`<main class="max-w-6xl mx-auto px-5 py-10"><div class="flex flex-wrap justify-between gap-4 mb-9"><div><p class="text-xs uppercase tracking-[.2em] text-red-400">Visão geral</p><h1 class="text-4xl font-black mt-2">Olá, administrador.</h1><p class="text-red-100/50 mt-2">Gerencie sua operação de avaliações em um só lugar.</p></div><button class="btn bg-redx-600" onclick="exportarPDF()">${icon('download')} Exportar PDF</button></div><div class="grid sm:grid-cols-3 gap-4 mb-8"><stat n="${data.links.length}" t="Formulários ativos"/><stat n="${data.links.reduce((a,x)=>a+(x.acessos||0),0)}" t="Acessos registrados"/><stat n="${data.instrutores.length}" t="Instrutores"/></div><div class="grid lg:grid-cols-[1.4fr_.8fr] gap-5"><section class="glass rounded-2xl p-6"><div class="flex justify-between items-center mb-5"><div><h2 class="text-xl font-bold">Formulários Google</h2><p class="text-xs text-red-100/45 mt-1">Cadastre e acompanhe seus links.</p></div></div><form onsubmit="addLink(event)" class="grid md:grid-cols-[1fr_1fr_auto] gap-2 mb-6"><input id="titulo" class="input" placeholder="Título da avaliação" required><input id="url" type="url" class="input" placeholder="https://forms.google.com/..." required><select id="materia" class="input"><option value="">Sem matéria</option>${data.materias.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select><button class="btn bg-redx-600 md:col-span-3 lg:col-span-1">${icon('plus')} Adicionar</button></form><div class="space-y-3">${data.links.map(l=>`<div class="flex flex-wrap items-center justify-between gap-3 bg-black/20 rounded-xl p-4 border border-red-100/5"><div><b>${esc(l.titulo)}</b><p class="text-xs text-red-100/40 mt-1">${esc(l.url)}</p></div><div class="flex gap-4 items-center text-sm"><span class="text-emerald-300">${l.acessos||0} acessos</span><button class="text-red-300 hover:text-red-400" onclick="removeLink(${l.id})">Excluir</button></div></div>`).join('')}</div></section><aside class="space-y-5"><section class="glass rounded-2xl p-6"><h2 class="text-xl font-bold">Cadastros</h2><p class="text-xs text-red-100/45 mt-1 mb-5">Instrutores e matérias do modelo.</p><form onsubmit="addInstructor(event)" class="flex gap-2 mb-3"><input id="inst" class="input" placeholder="Nome do instrutor" required><button class="btn bg-red-950 text-red-200">+</button></form><form onsubmit="addSubject(event)" class="flex gap-2"><input id="subj" class="input" placeholder="Nova matéria" required><button class="btn bg-red-950 text-red-200">+</button></form><div class="mt-5 space-y-2 text-sm">${data.instrutores.map(i=>`<p class="text-red-100/65">♙ ${esc(i.nome)}</p>`).join('')}${data.materias.map(m=>`<p class="text-red-100/65">▦ ${esc(m.nome)}</p>`).join('')}</div></section><section class="glass rounded-2xl p-6"><h2 class="text-xl font-bold">Resumo das respostas</h2><p class="text-xs text-red-100/45 mt-1">Distribuição padrão da avaliação.</p><div class="h-52 mt-4"><canvas id="summaryChart"></canvas></div></section></aside></div></main>` ,true)}
    function stat(n,t){return `<div class="glass rounded-2xl p-5"><p class="text-3xl font-black text-red-400">${n}</p><p class="text-xs text-red-100/50 mt-2">${t}</p></div>`} function addLink(e){e.preventDefault();const title=document.getElementById('titulo').value.trim(), linkUrl=document.getElementById('url').value.trim(), subject=document.getElementById('materia').value;if(!title||!linkUrl)return;data.links.push({id:Date.now(),titulo:title,url:linkUrl,materiaId:subject?Number(subject):null,acessos:0,acessados:[]});save().then(render).catch(error=>alert(error.message))} function removeLink(id){data.links=data.links.filter(x=>x.id!==id);save().then(render).catch(error=>alert(error.message))} function addInstructor(e){e.preventDefault();const field=document.getElementById('inst');if(!field.value.trim())return;data.instrutores.push({id:Date.now(),nome:field.value.trim()});save().then(render).catch(error=>alert(error.message))} function addSubject(e){e.preventDefault();const field=document.getElementById('subj');if(!field.value.trim())return;data.materias.push({id:Date.now(),nome:field.value.trim(),instrutorId:null});save().then(render).catch(error=>alert(error.message))}
    function draw(){if(!document.getElementById('summaryChart'))return;charts.summary?.destroy();charts.summary=new Chart(summaryChart,{type:'doughnut',data:{labels:['Excelente','Competente','Satisfatório','Aperfeiçoar'],datasets:[{data:[62,24,10,4],backgroundColor:['#ef4444','#b91c1c','#7f1d1d','#fecaca'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#fecaca',boxWidth:10,font:{size:10}}}}}})} function exportarPDF(){html2pdf().set({margin:.3,filename:'relatorio-voz-ativa.pdf',html2canvas:{scale:2,backgroundColor:'#090506'},jsPDF:{format:'a4'}}).from(document.querySelector('main')).save()} async function render(){await refreshData();let path=location.pathname.replace(/\/$/,'');document.getElementById('app').innerHTML=path==='/admin'?(sessionStorage.admin?adminPage():login()):publicPage();if(sessionStorage.admin&&path==='/admin')setTimeout(draw,50)} window.addEventListener('storage',event=>{if(event.key===KEY)render()}); render();
  </script>
</body>
</html>
